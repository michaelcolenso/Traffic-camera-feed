name: Deep instrument Live Grid

on:
  push:
    branches:
      - shift/pulse-truth-and-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shift/pulse-truth-and-ux
          fetch-depth: 0
      - name: Add one-run deep diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prototype/vanilla/public/benchmark.js')
          s = p.read_text()
          entry = "function syncLiveGrid() {\n  if (!liveGridEnabled || grid.hidden || document.hidden) return;"
          entry_new = "function syncLiveGrid() {\n  window.__LIVE_GRID_ENTRY__ = {liveGridEnabled,gridHidden:grid.hidden,documentHidden:document.hidden,cardCount:grid.querySelectorAll('.camera-card').length};\n  if (!liveGridEnabled || grid.hidden || document.hidden) return;"
          if entry not in s: raise SystemExit('entry target not found')
          s = s.replace(entry, entry_new, 1)
          target = "  const autoCandidates = [...new Map(candidates.map((camera)=>[camera.id,camera])).values()].slice(0,MAX_AUTO_LIVE);\n  const target = new Set(autoCandidates.map((camera)=>camera.id));"
          replacement = "  const autoCandidates = [...new Map(candidates.map((camera)=>[camera.id,camera])).values()].slice(0,MAX_AUTO_LIVE);\n  window.__LIVE_GRID_SELECTION__ = {visibleIds:[...visibleCards],nearViewport:nearViewport.map((camera)=>({id:camera.id,videoUrl:camera.videoUrl})),candidateIds:candidates.map((camera)=>camera.id),autoIds:autoCandidates.map((camera)=>camera.id),playerIds:[...gridPlayers.keys()]};\n  const target = new Set(autoCandidates.map((camera)=>camera.id));"
          if target not in s: raise SystemExit('selection target not found')
          p.write_text(s.replace(target, replacement, 1))
          PY
          rm .github/workflows/shift-live-grid-deep-debug.yml
          node --check prototype/vanilla/public/benchmark.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototype/vanilla/public/benchmark.js .github/workflows/shift-live-grid-deep-debug.yml
          git commit -m 'test: deeply instrument Live Grid selection'
          git push origin HEAD:shift/pulse-truth-and-ux
