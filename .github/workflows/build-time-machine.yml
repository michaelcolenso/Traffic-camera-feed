name: Build Traffic Time Machine

on:
  push:
    branches: [feature/traffic-time-machine]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Rerun Time Machine build with type compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/traffic-time-machine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/build_time_machine.py
      - run: python .github/scripts/fix_time_machine_types.py
      - run: npm ci
      - run: node --check prototype/vanilla/public/benchmark.js
      - run: npm run lint
      - run: npx wrangler types /tmp/time-machine-types.d.ts --config wrangler.jsonc
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/vanilla/history.ts prototype/vanilla/worker.ts prototype/vanilla/public/benchmark.js prototype/vanilla/public/benchmark.css wrangler.jsonc .github/workflows/deploy-cloudflare.yml
          git commit -m 'Build Traffic Time Machine feature'
          git push origin HEAD:feature/traffic-time-machine
