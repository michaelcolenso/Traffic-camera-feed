name: Apply camera health batching

on:
  push:
    branches:
      - perf/stabilize-mobile-tbt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Batch successful snapshot health updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()

          old = """  const loadMoreRef = useRef<HTMLDivElement>(null);\n  const deferredQuery = useDeferredValue(searchQuery);"""
          new = """  const loadMoreRef = useRef<HTMLDivElement>(null);\n  const pendingImageRefreshesRef = useRef<Record<string, number>>({});\n  const healthFlushTimerRef = useRef<number | null>(null);\n  const deferredQuery = useDeferredValue(searchQuery);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  const handleHealthChange = useCallback((camera: TrafficCamera, event: 'image-refresh' | 'image-error' | 'stream-error') => {\n    const id = getCameraId(camera);\n    setHealthByCamera((current) => ({\n      ...current,\n      [id]: {\n        ...current[id],\n        ...(event === 'image-refresh' ? { lastImageRefresh: Date.now(), lastImageError: undefined } : {}),\n        ...(event === 'image-error' ? { lastImageError: Date.now() } : {}),\n        ...(event === 'stream-error' ? { lastStreamError: Date.now() } : {}),\n      },\n    }));\n  }, []);"""
          new = """  const flushImageRefreshes = useCallback(() => {\n    const pending = pendingImageRefreshesRef.current;\n    pendingImageRefreshesRef.current = {};\n    healthFlushTimerRef.current = null;\n    const entries = Object.entries(pending);\n    if (entries.length === 0) return;\n\n    setHealthByCamera((current) => {\n      const next = { ...current };\n      for (const [id, refreshedAt] of entries) {\n        next[id] = {\n          ...next[id],\n          lastImageRefresh: refreshedAt,\n          lastImageError: undefined,\n        };\n      }\n      return next;\n    });\n  }, []);\n\n  const handleHealthChange = useCallback((camera: TrafficCamera, event: 'image-refresh' | 'image-error' | 'stream-error') => {\n    const id = getCameraId(camera);\n\n    if (event === 'image-refresh') {\n      pendingImageRefreshesRef.current[id] = Date.now();\n      if (healthFlushTimerRef.current === null) {\n        healthFlushTimerRef.current = window.setTimeout(flushImageRefreshes, 1_500);\n      }\n      return;\n    }\n\n    setHealthByCamera((current) => ({\n      ...current,\n      [id]: {\n        ...current[id],\n        ...(event === 'image-error' ? { lastImageError: Date.now() } : {}),\n        ...(event === 'stream-error' ? { lastStreamError: Date.now() } : {}),\n      },\n    }));\n  }, [flushImageRefreshes]);\n\n  useEffect(() => () => {\n    if (healthFlushTimerRef.current !== null) {\n      window.clearTimeout(healthFlushTimerRef.current);\n    }\n  }, []);"""
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-health-batching.yml
          git add src/App.tsx
          git commit -m "Batch camera refresh health updates"
          git push
