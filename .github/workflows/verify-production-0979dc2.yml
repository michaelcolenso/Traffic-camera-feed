name: Verify production 0979dc2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose cams.hoxel.dev release
        shell: bash
        run: |
          set -u
          nonce="$(date +%s%N)"
          fetch() {
            local name="$1" url="$2"
            local code
            code="$(curl -sS --max-time 15 -o "/tmp/${name}" -w '%{http_code}' "$url" || true)"
            echo "${name}_status=${code} bytes=$(wc -c < "/tmp/${name}" 2>/dev/null || echo 0)"
          }
          fetch home "https://cams.hoxel.dev/?verify=${nonce}"
          fetch js "https://cams.hoxel.dev/benchmark.js?verify=${nonce}"
          fetch cameras "https://cams.hoxel.dev/api/cameras?source=arcgis&verify=${nonce}"
          fetch history "https://cams.hoxel.dev/api/history/status?verify=${nonce}"
          fetch pulse "https://cams.hoxel.dev/api/pulse?limit=24&verify=${nonce}"

          echo "home_title=$(grep -q 'Seattle Traffic Watch' /tmp/home && echo yes || echo no)"
          echo "home_live_collection=$(grep -q 'data-collection=\"live\"' /tmp/home && echo yes || echo no)"
          echo "js_enabled_brace=$(grep -Fq 'if (!enabled) {' /tmp/js && echo yes || echo no)"
          echo "js_grid_else=$(grep -Fq '} else if (!grid.hidden) {' /tmp/js && echo yes || echo no)"
          echo "js_sync=$(grep -Fq 'syncLiveGrid();' /tmp/js && echo yes || echo no)"
          echo '--- setLiveGrid production snippet ---'
          grep -A16 -B2 'function setLiveGrid' /tmp/js || true
          echo '--- camera shape ---'
          jq -c 'if type=="array" and length>0 then {count:length,first:{id:.[0].id,collections:(.[0].collections // null),imagePath:(.[0].imagePath // null)}} else {type:type} end' /tmp/cameras 2>/dev/null || echo invalid-json
          echo '--- history shape ---'
          jq -c '{keys:(keys|sort),frames:(.frames // null),cameras:(.cameras // null),latest:(.latest // null)}' /tmp/history 2>/dev/null || echo invalid-json
          echo '--- pulse shape ---'
          jq -c '{keys:(keys|sort),itemsType:(.items|type),eventsType:(.events|type),camerasAnalyzed:(.camerasAnalyzed // null)}' /tmp/pulse 2>/dev/null || echo invalid-json

          failures=0
          grep -q 'Seattle Traffic Watch' /tmp/home || failures=$((failures+1))
          grep -q 'data-collection="live"' /tmp/home || failures=$((failures+1))
          grep -Fq 'if (!enabled) {' /tmp/js || failures=$((failures+1))
          grep -Fq '} else if (!grid.hidden) {' /tmp/js || failures=$((failures+1))
          grep -Fq 'syncLiveGrid();' /tmp/js || failures=$((failures+1))
          jq -e 'type == "array" and length > 0 and (.[0].collections | type == "array")' /tmp/cameras >/dev/null 2>&1 || failures=$((failures+1))
          jq -e 'has("frames") and has("cameras") and has("latest")' /tmp/history >/dev/null 2>&1 || failures=$((failures+1))
          jq -e '(.items | type == "array") and (.events | type == "array") and has("camerasAnalyzed")' /tmp/pulse >/dev/null 2>&1 || failures=$((failures+1))
          echo "failed_conditions=${failures}"
          test "$failures" -eq 0
