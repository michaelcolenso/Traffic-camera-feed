name: Verify production 0979dc2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify cams.hoxel.dev release
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl -fsS --max-time 15 -o /tmp/home "https://cams.hoxel.dev/?verify=${nonce}"
          curl -fsS --max-time 15 -o /tmp/js "https://cams.hoxel.dev/benchmark.js?verify=${nonce}"
          curl -fsS --max-time 15 -o /tmp/cameras "https://cams.hoxel.dev/api/cameras?source=arcgis&verify=${nonce}"
          curl -fsS --max-time 15 -o /tmp/history "https://cams.hoxel.dev/api/history/status?verify=${nonce}"
          curl -fsS --max-time 15 -o /tmp/pulse "https://cams.hoxel.dev/api/pulse?limit=24&verify=${nonce}"

          grep -q 'Seattle Traffic Watch' /tmp/home
          grep -q 'data-collection="live"' /tmp/home
          grep -Fq 'if (!enabled) {' /tmp/js
          grep -Fq 'queueMicrotask(syncLiveGrid);' /tmp/js
          grep -Fq 'requestAnimationFrame(syncLiveGrid);' /tmp/js
          jq -e 'type == "array" and length > 0 and (.[0].collections | type == "array")' /tmp/cameras >/dev/null
          jq -e 'has("frames") and has("cameras") and has("latest")' /tmp/history >/dev/null
          jq -e '(.items | type == "array") and (.events | type == "array") and has("camerasAnalyzed")' /tmp/pulse >/dev/null

          first_image_path="$(jq -r '.[0].imagePath // empty' /tmp/cameras)"
          first_camera_id="$(jq -r '.[0].id // empty' /tmp/cameras)"
          test -n "$first_image_path"
          test -n "$first_camera_id"
          encoded_image="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$first_image_path")"
          encoded_camera="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$first_camera_id")"

          curl -fsS --max-time 15 -o /tmp/image "https://cams.hoxel.dev/api/image?path=${encoded_image}&w=480"
          test -s /tmp/image
          curl -fsS --max-time 15 -o /tmp/timeline "https://cams.hoxel.dev/api/history?camera=${encoded_camera}&hours=6&limit=96"
          jq -e '.cameraId and (.frames | type == "array")' /tmp/timeline >/dev/null

          video_code="$(curl -sS --max-time 12 -o /tmp/video-error -w '%{http_code}' https://cams.hoxel.dev/api/video)"
          image_code="$(curl -sS --max-time 12 -o /tmp/image-error -w '%{http_code}' https://cams.hoxel.dev/api/image)"
          test "$video_code" = 400
          test "$image_code" = 400
          grep -q 'Invalid video path' /tmp/video-error
          grep -q 'Bad image path' /tmp/image-error

          echo "Production verification passed."
          echo "cameras=$(jq 'length' /tmp/cameras) history_frames=$(jq '.frames' /tmp/history) history_cameras=$(jq '.cameras' /tmp/history) pulse_cameras=$(jq '.camerasAnalyzed' /tmp/pulse) timeline_frames=$(jq '.frames|length' /tmp/timeline) transformed_image_bytes=$(wc -c < /tmp/image)"
