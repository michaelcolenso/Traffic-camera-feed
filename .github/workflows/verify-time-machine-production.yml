name: Verify production Time Machine collector

on:
  push:
    branches: [verify/time-machine-production]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify production Time Machine collector'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify post-deploy production captures and R2 serving
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_LATEST=1786935447000
          production_ok=0
          for i in {1..12}; do
            nonce=$(date +%s%N)
            curl -fsSL "https://cams.hoxel.dev/api/history/status?verify=$nonce" -o /tmp/status.json
            frames=$(jq -r '.frames' /tmp/status.json)
            cameras=$(jq -r '.cameras' /tmp/status.json)
            latest=$(jq -r '.latest // 0' /tmp/status.json)
            echo "production poll $i: frames=$frames cameras=$cameras latest=$latest"
            if [ "$frames" -gt 59 ] && [ "$cameras" -gt 58 ] && [ "$latest" -gt "$VALIDATION_LATEST" ]; then
              production_ok=1
              break
            fi
            sleep 15
          done
          test "$production_ok" -eq 1 || { echo 'Production collector did not advance history'; cat /tmp/status.json; exit 1; }

          npx wrangler d1 execute HISTORY_DB --remote --config wrangler.jsonc --json --command \
            "SELECT camera_id, r2_key, captured_at FROM camera_snapshots WHERE captured_at > ${VALIDATION_LATEST} ORDER BY captured_at DESC LIMIT 1" > /tmp/latest.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json'))
          rows=[]
          for result in data if isinstance(data,list) else [data]: rows.extend(result.get('results',[]))
          if not rows: raise SystemExit('No post-validation production D1 row found')
          row=rows[0]
          print('latest production row:',row)
          open('/tmp/camera-id','w').write(row['camera_id'])
          open('/tmp/r2-key','w').write(row['r2_key'])
          open('/tmp/captured-at','w').write(str(row['captured_at']))
          PY
          camera=$(python -c 'import urllib.parse;print(urllib.parse.quote(open("/tmp/camera-id").read(),safe=""))')
          key=$(python -c 'import urllib.parse;print(urllib.parse.quote(open("/tmp/r2-key").read(),safe=""))')
          curl -fsSL "https://cams.hoxel.dev/api/history?camera=$camera&hours=6&limit=20&verify=$(date +%s%N)" -o /tmp/timeline.json
          jq -e '.frames | length > 0' /tmp/timeline.json >/dev/null
          status=$(curl -sS --max-time 15 -o /tmp/history.webp -w '%{http_code}' "https://cams.hoxel.dev/api/history/image?key=$key")
          test "$status" = 200
          test -s /tmp/history.webp
          file /tmp/history.webp
          echo "FINAL_STATUS=$(cat /tmp/status.json)"
          echo "LATEST_CAMERA=$(cat /tmp/camera-id)"
          echo "LATEST_CAPTURED_AT=$(cat /tmp/captured-at)"
          echo "TIMELINE_FRAMES=$(jq -r '.frames|length' /tmp/timeline.json)"
