name: Benchmark Cloudflare vanilla prototype

on:
  push:
    branches:
      - prototype/cloudflare-vanilla
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanilla-architecture-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Existing TypeScript regression check
        run: npm run lint

      - name: Validate prototype and production Wrangler configurations
        run: |
          npx wrangler types prototype/vanilla/worker-configuration.d.ts --config prototype/vanilla/wrangler.jsonc
          test -s prototype/vanilla/worker-configuration.d.ts
          npx wrangler types worker-configuration.d.ts --config wrangler.jsonc
          test -s worker-configuration.d.ts

      - name: Deploy isolated vanilla Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config prototype/vanilla/wrangler.jsonc 2>&1 | tee /tmp/vanilla-deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/vanilla-deploy.log | tail -1)"
          test -n "$url" || { echo 'Could not determine workers.dev preview URL'; cat /tmp/vanilla-deploy.log; exit 1; }
          echo "VANILLA_URL=$url" >> "$GITHUB_ENV"
          echo "Vanilla prototype: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test prototype
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..12}; do
            home_status="$(curl --silent --show-error --max-time 15 -o /tmp/vanilla.html -w '%{http_code}' "$VANILLA_URL/" || true)"
            js_status="$(curl --silent --show-error --max-time 15 -o /tmp/vanilla.js -w '%{http_code}' "$VANILLA_URL/benchmark.js" || true)"
            api_status="$(curl --silent --show-error --max-time 15 -o /tmp/cameras.json -w '%{http_code}' "$VANILLA_URL/api/cameras?source=arcgis" || true)"
            echo "Preview readiness ${attempt}/12: home=${home_status}, js=${js_status}, api=${api_status}"
            if [ "$home_status" = 200 ] && [ "$js_status" = 200 ] && [ "$api_status" = 200 ] \
              && grep -q 'Seattle Traffic Watch' /tmp/vanilla.html \
              && grep -q 'window.__CAMERAS__=' /tmp/vanilla.html \
              && grep -q 'data-collection="live"' /tmp/vanilla.html \
              && grep -q 'map-view' /tmp/vanilla.html; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1 || { echo 'Vanilla preview did not become healthy'; head -c 500 /tmp/vanilla.html || true; exit 1; }

      - name: Feature parity browser checks
        run: |
          npx playwright install chromium --with-deps >/dev/null
          node tests/vanilla-parity.mjs

      - name: Benchmark React production and vanilla replacement
        shell: bash
        run: |
          set -euo pipefail
          for app in react vanilla; do
            if [ "$app" = react ]; then url='https://cams.hoxel.dev/'; else url="$VANILLA_URL/"; fi
            for sample in 1 2 3; do
              echo "Lighthouse $app sample $sample"
              npx --yes lighthouse@latest "$url" \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                --output=json \
                --output-path="./lh-${app}-${sample}.json" \
                --quiet
            done
          done

      - name: Publish comparison and enforce replacement budget
        shell: python
        run: |
          import json, os, statistics, sys
          def row(app, i):
              with open(f'lh-{app}-{i}.json') as f: r=json.load(f)
              a=r['audits']; c=r['categories']
              return {
                'score': round(c['performance']['score']*100),
                'a11y': round(c['accessibility']['score']*100),
                'fcp': a['first-contentful-paint']['numericValue'],
                'lcp': a['largest-contentful-paint']['numericValue'],
                'tbt': a['total-blocking-time']['numericValue'],
                'cls': a['cumulative-layout-shift']['numericValue'],
                'bytes': a.get('total-byte-weight',{}).get('numericValue',0),
              }
          data={app:[row(app,i) for i in (1,2,3)] for app in ('react','vanilla')}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## React vs Cloudflare-native feature-parity replacement\n\n')
              f.write('| App | Scores | Min | Median | LCP median | TBT median | CLS max | Transfer median | A11y min |\n')
              f.write('|---|---|---:|---:|---:|---:|---:|---:|---:|\n')
              for app, rows in data.items():
                  scores=[x['score'] for x in rows]
                  f.write(f"| {app.title()} | {' / '.join(map(str,scores))} | {min(scores)} | {statistics.median(scores):g} | {statistics.median(x['lcp'] for x in rows)/1000:.2f}s | {statistics.median(x['tbt'] for x in rows):.0f}ms | {max(x['cls'] for x in rows):.3f} | {statistics.median(x['bytes'] for x in rows)/1024:.0f} KiB | {min(x['a11y'] for x in rows)} |\n")
          print(json.dumps(data, indent=2))
          v=data['vanilla']
          failures=[]
          if min(x['score'] for x in v) < 95: failures.append('minimum Lighthouse performance must be >=95')
          if statistics.median(x['lcp'] for x in v) > 2500: failures.append('median LCP must be <=2.5s')
          if statistics.median(x['tbt'] for x in v) > 100: failures.append('median TBT must be <=100ms')
          if max(x['cls'] for x in v) > 0.05: failures.append('max CLS must be <=0.05')
          if min(x['a11y'] for x in v) < 98: failures.append('accessibility must be >=98')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-benchmark
          path: |
            lh-*.json
            test-artifacts/*.png
          retention-days: 14
