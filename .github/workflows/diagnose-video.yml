name: Diagnose video feeds

on:
  push:
    branches: [fix/live-video-feeds]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ArcGIS stream names and candidate HLS origins
        shell: bash
        run: |
          set -x
          ARC='https://services.arcgis.com/ZOyb2t4B0UYuYNYH/ArcGIS/rest/services/Traffic_Cameras_CDL/FeatureServer/0/query?where=SERVSTAT%3D%27ACTV%27&outFields=NAME%2CLOCATION%2CSTREAM_NAME&returnGeometry=false&f=json'
          curl -fsSL "$ARC" -o /tmp/cameras.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cameras.json'))
          for f in d.get('features',[])[:10]: print(f.get('attributes'))
          names=[f.get('attributes',{}).get('STREAM_NAME') for f in d.get('features',[]) if f.get('attributes',{}).get('STREAM_NAME')]
          print('FIRST_STREAM='+str(names[0] if names else ''))
          open('/tmp/stream','w').write(names[0] if names else '')
          PY
          S=$(cat /tmp/stream)
          test -n "$S"
          for H in 61e0c5d388c2e.streamlock.net 58cc2dce193dd.streamlock.net; do
            echo "=== $H ==="
            curl -k -sS -D - --max-time 15 -o /tmp/body "https://$H/live/$S.stream/playlist.m3u8" | head -30 || true
            echo 'BODY:'; head -20 /tmp/body || true
          done
          echo '=== production proxy ==='
          curl -sS -D - --max-time 20 -o /tmp/proxy "https://cams.hoxel.dev/api/video?url=%2Flive%2F${S}.stream%2Fplaylist.m3u8" | head -30 || true
          echo 'PROXY BODY:'; head -20 /tmp/proxy || true
