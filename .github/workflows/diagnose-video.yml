name: Diagnose video feeds

on:
  push:
    branches: [fix/live-video-feeds]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official Travelers video module
        shell: bash
        run: |
          set -euo pipefail
          for U in \
            'https://web.seattle.gov/Travelers/js/camera.video.js' \
            'https://web.seattle.gov/Travelers/js/config.js' \
            'https://web.seattle.gov/Travelers/js/view.mapmain.js' \
            'https://web.seattle.gov/Travelers/js/view.index.js'; do
            echo "===== $U ====="
            curl -fsSL --max-time 20 "$U" | sed -n '1,500p'
          done
