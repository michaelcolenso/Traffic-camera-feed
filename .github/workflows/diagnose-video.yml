name: Diagnose video feeds

on:
  push:
    branches: [fix/live-video-feeds]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Trace official Travelers Wowza URL resolver
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://web.seattle.gov/Travelers/js/utils.js' -o /tmp/utils.js
          echo '===== getWowsaUrl context ====='
          grep -n -A25 -B15 -Ei 'getWowsaUrl|Wowsa|wowza' /tmp/utils.js || true
          echo '===== API/config calls in utils ====='
          grep -n -E -A8 -B4 'api/|ajax|Config|config' /tmp/utils.js | head -500 || true
          echo '===== Travelers API candidates ====='
          for P in \
            'api/Map/GetWowsaUrl' \
            'api/Map/GetWowzaUrl' \
            'api/Map/GetConfig' \
            'api/Map/GetConfiguration'; do
            echo "--- $P ---"
            curl -sS -D - --max-time 15 -o /tmp/body "https://web.seattle.gov/Travelers/$P" | head -25 || true
            head -20 /tmp/body || true
          done
