name: Diagnose video feeds

on:
  push:
    branches: [fix/live-video-feeds]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check prototype/vanilla/public/benchmark.js
      - run: npm run lint
      - name: Deploy isolated candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config prototype/vanilla/wrangler.jsonc 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          echo "VANILLA_URL=$url" >> "$GITHUB_ENV"
      - name: Wait for candidate
        shell: bash
        run: |
          for i in {1..12}; do
            code=$(curl -sS --max-time 10 -o /tmp/home -w '%{http_code}' "$VANILLA_URL/?validation=$(date +%s)" || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          exit 1
      - name: Verify direct HLS metadata and bounded proxy
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(date +%s%N)
          curl -fsSL "$VANILLA_URL/api/cameras?validation=$nonce" -o /tmp/cameras.json
          python - <<'PY'
          import json
          cams=json.load(open('/tmp/cameras.json'))
          live=[c for c in cams if c.get('videoUrl')]
          assert live, 'no live cameras'
          c=live[0]
          assert c.get('directVideoUrl','').startswith('https://61e0c5d388c2e.streamlock.net'), c
          assert c.get('webUrl') == 'https://web.seattle.gov/Travelers/', c
          print(c['label'], c['directVideoUrl'])
          open('/tmp/proxy-path','w').write(c['videoUrl'])
          PY
          path=$(cat /tmp/proxy-path)
          start=$(date +%s)
          code=$(curl -sS --max-time 12 -o /tmp/proxy -w '%{http_code}' "$VANILLA_URL$path&validation=$nonce" || true)
          elapsed=$(( $(date +%s) - start ))
          echo "proxy status=$code elapsed=${elapsed}s body=$(cat /tmp/proxy 2>/dev/null || true)"
          [ "$elapsed" -le 10 ]
          case "$code" in 200|502|504) ;; *) exit 1 ;; esac
      - name: Browser snapshot-first regression
        shell: bash
        run: |
          npx playwright install chromium --with-deps >/dev/null
          cat > tests/video-fallback.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.route('https://61e0c5d388c2e.streamlock.net/**',async route=>{
            await new Promise(resolve=>setTimeout(resolve,1200));
            await route.abort('failed');
          });
          await page.goto(`${process.env.VANILLA_URL}/?validation=${Date.now()}`,{waitUntil:'networkidle'});
          const play=page.locator('[data-grid-play]').first();
          await play.click();
          const card=play.locator('xpath=ancestor::article');
          const img=card.locator('img');
          if (await img.isHidden()) throw new Error('snapshot hidden before playback');
          const label=(await play.locator('.play-label').textContent())?.trim();
          if (label !== 'Connecting') throw new Error(`expected Connecting, got ${label}`);
          await page.waitForTimeout(9000);
          if (await img.isHidden()) throw new Error('snapshot hidden after failed stream');
          const finalLabel=(await play.locator('.play-label').textContent())?.trim();
          if (finalLabel !== 'Play live') throw new Error(`expected snapshot fallback, got ${finalLabel}`);
          if (errors.length) throw new Error(errors.join('; '));
          await browser.close();
          console.log('snapshot-first playback regression passed');
          JS
          node tests/video-fallback.mjs
