name: Provision Traffic Time Machine

on:
  push:
    branches: [feature/traffic-time-machine]

permissions:
  contents: write

jobs:
  provision:
    if: github.event.head_commit.message == 'Provision Time Machine Cloudflare storage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/traffic-time-machine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create or discover D1 and R2 resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DB_NAME=hoxel-traffic-camera-history
          BUCKET_NAME=hoxel-traffic-camera-history

          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/d1.json'))
          print(next((r.get('uuid') or r.get('id') for r in rows if r.get('name')=='hoxel-traffic-camera-history'),''))
          PY
          )
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DB_NAME" >/tmp/d1-create.txt
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/d1.json'))
          print(next((r.get('uuid') or r.get('id') for r in rows if r.get('name')=='hoxel-traffic-camera-history'),''))
          PY
            )
          fi
          test -n "$DB_ID" || { echo 'Unable to resolve D1 database id'; cat /tmp/d1.json; exit 1; }

          if ! npx wrangler r2 bucket create "$BUCKET_NAME" >/tmp/r2-create.txt 2>&1; then
            cat /tmp/r2-create.txt
            if ! grep -Eqi 'already exists|already been taken|code.*10004' /tmp/r2-create.txt; then exit 1; fi
          fi

          python - "$DB_ID" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('wrangler.jsonc')
          data=json.loads(p.read_text())
          data['d1_databases']=[{
            'binding':'HISTORY_DB',
            'database_name':'hoxel-traffic-camera-history',
            'database_id':sys.argv[1],
            'migrations_dir':'migrations'
          }]
          data['r2_buckets']=[{
            'binding':'HISTORY_BUCKET',
            'bucket_name':'hoxel-traffic-camera-history'
          }]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          npx wrangler d1 migrations apply HISTORY_DB --remote --config wrangler.jsonc
          npx wrangler types /tmp/time-machine-bindings.d.ts --config wrangler.jsonc
          grep -q 'HISTORY_DB' /tmp/time-machine-bindings.d.ts
          grep -q 'HISTORY_BUCKET' /tmp/time-machine-bindings.d.ts
      - name: Commit bindings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.jsonc
          git commit -m 'Bind Time Machine D1 and R2 storage'
          git push origin HEAD:feature/traffic-time-machine
