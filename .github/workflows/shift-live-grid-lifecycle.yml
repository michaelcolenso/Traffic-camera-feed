name: Apply Live Grid lifecycle fix

on:
  push:
    branches:
      - shift/pulse-truth-and-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shift/pulse-truth-and-ux
          fetch-depth: 0
      - name: Patch lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prototype/vanilla/public/benchmark.js')
          s = p.read_text()
          old = "      if (gridPlayers.has(id)) stopGridVideo(id);"
          new = "      const player = gridPlayers.get(id);\n      if (player?.mode === 'manual') stopGridVideo(id);"
          if old not in s:
              raise SystemExit('observer teardown target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/shift-live-grid-lifecycle.yml
          node --check prototype/vanilla/public/benchmark.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototype/vanilla/public/benchmark.js .github/workflows/shift-live-grid-lifecycle.yml
          git commit -m 'fix: make Live Grid own auto-player lifecycle'
          git push origin HEAD:shift/pulse-truth-and-ux
