name: One-shot dependency cleanup

on:
  push:
    branches:
      - ci/health-audit-bundle

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused AI Studio and server dependencies
        run: npm uninstall @google/genai better-sqlite3 dotenv express

      - name: Apply safe npm audit fixes
        run: npm audit fix || true

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Report remaining vulnerabilities
        run: npm audit || true

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-cleanup.yml
          git add package.json package-lock.json
          git commit -m "Clean dependencies and apply safe audit fixes"
          git push
