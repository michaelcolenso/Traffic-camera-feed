name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cams-hoxel-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, migrate, deploy, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Browser module syntax check
        run: node --check prototype/vanilla/public/benchmark.js

      - name: Validate production Wrangler configuration
        run: |
          npx wrangler types worker-configuration.d.ts --config wrangler.jsonc
          test -s worker-configuration.d.ts
          grep -q 'HISTORY_DB' worker-configuration.d.ts
          grep -q 'HISTORY_BUCKET' worker-configuration.d.ts
          grep -q 'IMAGES' worker-configuration.d.ts

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply HISTORY_DB --remote --config wrangler.jsonc

      - name: Deploy cams.hoxel.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail

          home_ok=0
          for attempt in {1..12}; do
            nonce="$(date +%s%N)"
            home_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-home -w '%{http_code}' "https://cams.hoxel.dev/?smoke=${nonce}" || true)"
            js_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-js -w '%{http_code}' "https://cams.hoxel.dev/benchmark.js?smoke=${nonce}" || true)"
            api_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-cameras -w '%{http_code}' "https://cams.hoxel.dev/api/cameras?source=arcgis&smoke=${nonce}" || true)"
            history_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-history -w '%{http_code}' "https://cams.hoxel.dev/api/history/status?smoke=${nonce}" || true)"
            pulse_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-pulse -w '%{http_code}' "https://cams.hoxel.dev/api/pulse?limit=24&smoke=${nonce}" || true)"
            echo "Production readiness ${attempt}/12: home=${home_status}, js=${js_status}, cameras=${api_status}, history=${history_status}, pulse=${pulse_status}"
            if [ "$home_status" = "200" ] && [ "$js_status" = "200" ] && [ "$api_status" = "200" ] && [ "$history_status" = "200" ] && [ "$pulse_status" = "200" ] \
              && grep -q 'Seattle Traffic Watch' /tmp/cams-home \
              && grep -q 'window.__CAMERAS__=' /tmp/cams-home \
              && grep -q 'data-collection="live"' /tmp/cams-home \
              && jq -e 'type == "array" and length > 0 and (.[0].collections | type == "array")' /tmp/cams-cameras >/dev/null \
              && jq -e 'has("frames") and has("cameras") and has("latest")' /tmp/cams-history >/dev/null \
              && jq -e '(.items | type == "array") and (.events | type == "array") and has("camerasAnalyzed")' /tmp/cams-pulse >/dev/null; then
              home_ok=1
              break
            fi
            sleep 5
          done
          test "$home_ok" -eq 1 || { echo "cams.hoxel.dev did not become healthy"; cat /tmp/cams-history || true; cat /tmp/cams-pulse || true; exit 1; }

          video_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-video -w '%{http_code}' https://cams.hoxel.dev/api/video)"
          test "$video_status" = "400" || { echo "Expected /api/video without a URL to return 400, got ${video_status}"; cat /tmp/cams-video; exit 1; }
          grep -q 'Invalid video path' /tmp/cams-video || { echo "Unexpected /api/video response body"; cat /tmp/cams-video; exit 1; }

          image_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-image -w '%{http_code}' https://cams.hoxel.dev/api/image)"
          test "$image_status" = "400" || { echo "Expected /api/image without a path to return 400, got ${image_status}"; cat /tmp/cams-image; exit 1; }
          grep -q 'Bad image path' /tmp/cams-image || { echo "Unexpected /api/image response body"; cat /tmp/cams-image; exit 1; }

          first_image_path="$(jq -r '.[0].imagePath // empty' /tmp/cams-cameras)"
          first_camera_id="$(jq -r '.[0].id // empty' /tmp/cams-cameras)"
          test -n "$first_image_path" || { echo "Camera payload did not include an imagePath"; exit 1; }
          test -n "$first_camera_id" || { echo "Camera payload did not include an id"; exit 1; }
          encoded_image_path="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$first_image_path")"
          encoded_camera_id="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$first_camera_id")"
          transformed_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-transformed -w '%{http_code}' "https://cams.hoxel.dev/api/image?path=${encoded_image_path}&w=480")"
          test "$transformed_status" = "200" || { echo "Expected transformed camera image to return 200, got ${transformed_status}"; exit 1; }

          timeline_ok=0
          for attempt in {1..12}; do
            nonce="$(date +%s%N)"
            timeline_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-timeline -w '%{http_code}' "https://cams.hoxel.dev/api/history?camera=${encoded_camera_id}&hours=6&limit=96&smoke=${nonce}" || true)"
            echo "History timeline readiness ${attempt}/12: ${timeline_status}"
            if [ "$timeline_status" = "200" ] && jq -e '.cameraId and (.frames | type == "array")' /tmp/cams-timeline >/dev/null 2>&1; then
              timeline_ok=1
              break
            fi
            sleep 5
          done
          test "$timeline_ok" -eq 1 || { echo "History timeline did not become healthy"; cat /tmp/cams-timeline || true; exit 1; }

          echo "Core production smoke test passed: app, canonical cameras, images, D1/R2 history, Pulse, and timeline endpoints are healthy"

          # Live HLS is an external dependency. Probe several current streams for visibility,
          # but do not fail a healthy deployment when Seattle's streaming origin is unavailable.
          stream_ok=0
          tested=0
          while IFS=$'\t' read -r video_url camera_name; do
            test -n "$video_url" || continue
            case "$video_url" in
              /api/video*) ;;
              *) continue ;;
            esac
            tested=$((tested + 1))
            stream_url="https://cams.hoxel.dev${video_url}"
            echo "Testing HLS camera ${tested}: ${camera_name:-Seattle camera}"
            if curl --fail --silent --show-error --max-time 6 "$stream_url" -o /tmp/sdot-playlist.m3u8 \
              && grep -q '^#EXTM3U' /tmp/sdot-playlist.m3u8; then
              stream_ok=1
              echo "Working HLS stream found"
              break
            fi
            test "$tested" -lt 5 || break
          done < <(jq -r '.[] | select(.videoUrl != null and .videoUrl != "") | [(.videoUrl // ""), (.label // "Seattle camera")] | @tsv' /tmp/cams-cameras)

          if [ "$tested" -eq 0 ]; then
            echo "::warning::Current camera feed returned no live streams to probe"
          elif [ "$stream_ok" -ne 1 ]; then
            echo "::warning::None of the first ${tested} current streams returned an HLS manifest; deployment is healthy but external live video is unavailable from this runner"
          else
            echo "External HLS probe passed"
          fi
