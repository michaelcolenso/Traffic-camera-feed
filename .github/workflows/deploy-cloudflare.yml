name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cams-hoxel-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, build, deploy, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

      - name: Deploy cams.hoxel.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail

          home_ok=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://cams.hoxel.dev/ -o /tmp/cams-home \
              && grep -q '<div id="root"></div>' /tmp/cams-home; then
              home_ok=1
              break
            fi
            echo "Home page not ready yet (attempt ${attempt}/12)"
            sleep 5
          done
          test "$home_ok" -eq 1 || { echo "cams.hoxel.dev did not become healthy"; exit 1; }

          api_status="$(curl --silent --show-error --max-time 10 -o /tmp/cams-api -w '%{http_code}' https://cams.hoxel.dev/api/video)"
          test "$api_status" = "400" || { echo "Expected /api/video without a URL to return 400, got ${api_status}"; cat /tmp/cams-api; exit 1; }
          grep -q 'Invalid or missing video path' /tmp/cams-api || { echo "Unexpected /api/video response body"; cat /tmp/cams-api; exit 1; }

          arcgis_url='https://services.arcgis.com/ZOyb2t4B0UYuYNYH/ArcGIS/rest/services/Traffic_Cameras_CDL/FeatureServer/0/query?where=STREAM_NAME%20IS%20NOT%20NULL%20AND%20SERVSTAT%20%3C%3E%20%27INACT%27&outFields=NAME%2CLOCATION%2CSTREAM_NAME%2CSERVSTAT&returnGeometry=false&resultRecordCount=25&f=json'
          curl --fail --silent --show-error --max-time 15 "$arcgis_url" -o /tmp/sdot-cameras.json

          stream_ok=0
          tested=0
          while IFS=$'\t' read -r stream_name camera_name; do
            test -n "$stream_name" || continue
            tested=$((tested + 1))
            stream_path="/live/${stream_name}.stream/playlist.m3u8"
            encoded_path="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$stream_path")"
            stream_url="https://cams.hoxel.dev/api/video?url=${encoded_path}"
            echo "Testing SDOT HLS camera ${tested}: ${camera_name:-SDOT camera} (${stream_name})"

            if curl --fail --silent --show-error --max-time 8 "$stream_url" -o /tmp/sdot-playlist.m3u8 \
              && grep -q '^#EXTM3U' /tmp/sdot-playlist.m3u8; then
              stream_ok=1
              echo "Working SDOT HLS stream found: ${stream_name}"
              break
            fi

            echo "Stream ${stream_name} unavailable; trying another active SDOT camera"
            test "$tested" -lt 8 || break
          done < <(
            jq -r '.features[]?.attributes | select(.STREAM_NAME != null and .STREAM_NAME != "") | [(.STREAM_NAME // ""), (.LOCATION // .NAME // "SDOT camera")] | @tsv' /tmp/sdot-cameras.json
          )

          test "$tested" -gt 0 || { echo "Official SDOT layer returned no active STREAM_NAME"; cat /tmp/sdot-cameras.json; exit 1; }
          test "$stream_ok" -eq 1 || { echo "None of the first ${tested} current SDOT streams returned an HLS manifest"; exit 1; }

          echo "Production smoke test passed, including a live SDOT HLS manifest"
