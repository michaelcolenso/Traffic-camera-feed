name: Build Seattle Pulse

on:
  push:
    branches: [feature/seattle-pulse]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run Seattle Pulse implementation v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Seattle Pulse
        run: python scripts/apply-seattle-pulse.py
      - name: Validate
        run: |
          node --check prototype/vanilla/public/benchmark.js
          npm run lint
          npx wrangler types /tmp/pulse-worker-types.d.ts --config wrangler.jsonc
          grep -q HISTORY_DB /tmp/pulse-worker-types.d.ts
      - name: Commit product code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/vanilla/pulse.ts prototype/vanilla/worker.ts prototype/vanilla/public/benchmark.js prototype/vanilla/public/benchmark.css
          git commit -m 'Implement Seattle Pulse ranking and UI'
          git push
