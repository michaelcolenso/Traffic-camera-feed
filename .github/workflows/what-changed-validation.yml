name: Validate What Changed

on:
  push:
    branches:
      - feature/what-changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: what-changed-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax check
        run: node --check prototype/vanilla/public/benchmark.js
      - name: TypeScript regression check
        run: npm run lint
      - name: Validate Worker config
        run: npx wrangler types prototype/vanilla/worker-configuration.d.ts --config prototype/vanilla/wrangler.jsonc
      - name: Deploy isolated candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config prototype/vanilla/wrangler.jsonc 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          echo "VANILLA_URL=$url" >> "$GITHUB_ENV"
      - name: Wait for candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            home="$(curl --silent --show-error --max-time 15 -o /tmp/home -w '%{http_code}' "$VANILLA_URL/" || true)"
            js="$(curl --silent --show-error --max-time 15 -o /tmp/app -w '%{http_code}' "$VANILLA_URL/benchmark.js" || true)"
            if [ "$home" = 200 ] && [ "$js" = 200 ] && grep -q 'Unusual Now' /tmp/app; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Browser anomaly checks
        run: |
          npx playwright install chromium --with-deps >/dev/null
          cat > tests/what-changed.mjs <<'JS'
          import { chromium } from 'playwright';
          const base = process.env.VANILLA_URL;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];
          page.on('pageerror',error=>errors.push(String(error)));
          await page.goto(base,{waitUntil:'networkidle'});
          const unusual = page.locator('[data-collection="unusual"]');
          if (await unusual.count() !== 1) throw new Error('Unusual Now collection missing');
          const firstImg = page.locator('.camera-card img').first();
          await firstImg.waitFor({state:'visible'});
          await page.waitForTimeout(500);
          const canvasReadable = await firstImg.evaluate((img)=>{
            const canvas=document.createElement('canvas'); canvas.width=2; canvas.height=2;
            const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,2,2);
            try { return ctx.getImageData(0,0,1,1).data.length===4; } catch { return false; }
          });
          if (!canvasReadable) throw new Error('Camera image pixels are not canvas-readable');
          const baselines = await page.locator('#diagnostics').evaluate((el)=>el.textContent.includes('Baselines learned'));
          if (!baselines) throw new Error('Anomaly diagnostics missing');
          if (errors.length) throw new Error(`Page errors: ${errors.join('; ')}`);
          await browser.close();
          console.log('What Changed browser checks passed');
          JS
          node tests/what-changed.mjs
      - name: Three-sample Lighthouse budget
        shell: bash
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            npx --yes lighthouse@latest "$VANILLA_URL/" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --output=json --output-path="./lh-${sample}.json" --quiet
          done
          python - <<'PY'
          import json, statistics
          rows=[]
          for i in (1,2,3):
              with open(f'lh-{i}.json') as f:r=json.load(f)
              a=r['audits'];c=r['categories']
              rows.append((round(c['performance']['score']*100),a['largest-contentful-paint']['numericValue'],a['total-blocking-time']['numericValue'],a['cumulative-layout-shift']['numericValue'],round(c['accessibility']['score']*100)))
          print(rows)
          assert min(x[0] for x in rows)>=95, rows
          assert statistics.median(x[1] for x in rows)<=2500, rows
          assert statistics.median(x[2] for x in rows)<=150, rows
          assert max(x[3] for x in rows)<=0.05, rows
          assert min(x[4] for x in rows)>=98, rows
          PY
