name: Validate Traffic Time Machine

on:
  push:
    branches: [feature/traffic-time-machine]

permissions:
  contents: read

jobs:
  cleanup-preview:
    if: github.event.head_commit.message == 'Disable isolated Time Machine cron'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Redeploy benchmark worker without cron
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('wrangler.jsonc').read_text())
          data['name']='hoxel-traffic-camera-vanilla-benchmark'
          data.pop('routes',None)
          data.pop('triggers',None)
          data['workers_dev']=True
          data['preview_urls']=True
          Path('wrangler.preview.jsonc').write_text(json.dumps(data,indent=2)+'\n')
          PY
          npx wrangler deploy --config wrangler.preview.jsonc
