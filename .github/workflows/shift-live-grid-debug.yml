name: Instrument Live Grid selection

on:
  push:
    branches:
      - shift/pulse-truth-and-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shift/pulse-truth-and-ux
          fetch-depth: 0
      - name: Add one-run selection diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prototype/vanilla/public/benchmark.js')
          s = p.read_text()
          old = "  const autoCandidates = [...new Map(candidates.map((camera)=>[camera.id,camera])).values()].slice(0,MAX_AUTO_LIVE);\n  const target = new Set(autoCandidates.map((camera)=>camera.id));"
          new = "  const autoCandidates = [...new Map(candidates.map((camera)=>[camera.id,camera])).values()].slice(0,MAX_AUTO_LIVE);\n  window.__LIVE_GRID_DEBUG__ = {view,liveGridEnabled,gridHidden:grid.hidden,visibleIds:[...visibleCards],nearViewport:nearViewport.map((camera)=>camera.id),candidateIds:candidates.map((camera)=>camera.id),autoIds:autoCandidates.map((camera)=>camera.id)};\n  const target = new Set(autoCandidates.map((camera)=>camera.id));"
          if old not in s:
              raise SystemExit('syncLiveGrid diagnostic target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/shift-live-grid-debug.yml
          node --check prototype/vanilla/public/benchmark.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototype/vanilla/public/benchmark.js .github/workflows/shift-live-grid-debug.yml
          git commit -m 'test: instrument Live Grid candidate selection'
          git push origin HEAD:shift/pulse-truth-and-ux
