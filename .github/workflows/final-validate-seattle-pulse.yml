name: Final Validate Seattle Pulse

on:
  push:
    branches: [feature/seattle-pulse]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Final validate Seattle Pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate source
        run: |
          node --check prototype/vanilla/public/benchmark.js
          npm run lint
      - name: Build isolated preview config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('wrangler.jsonc').read_text())
          data['name']='hoxel-traffic-camera-pulse-benchmark'
          data.pop('routes',None)
          data.pop('triggers',None)
          data['workers_dev']=True
          data['preview_urls']=True
          Path('wrangler.pulse-preview.jsonc').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Deploy isolated Pulse preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.pulse-preview.jsonc 2>&1 | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)
          test -n "$url"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - name: Validate live Pulse evidence
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..15}; do
            nonce=$(date +%s%N)
            status=$(curl -sS --max-time 15 -o /tmp/pulse.json -w '%{http_code}' "$PREVIEW_URL/api/pulse?window=60&limit=12&v=$nonce" || true)
            if [ "$status" = 200 ] && jq -e '.camerasAnalyzed > 0 and (.items|length)>0' /tmp/pulse.json >/dev/null 2>&1; then break; fi
            sleep 3
          done
          test "$status" = 200
          jq -e '.pulseScore >= 0 and .pulseScore <= 100' /tmp/pulse.json >/dev/null
          jq -e '.activeCameras >= 0 and .camerasAnalyzed >= .activeCameras' /tmp/pulse.json >/dev/null
          jq -e '.methodology | contains("does not infer crashes")' /tmp/pulse.json >/dev/null
          jq -e 'all(.items[]; .score >= 0 and .score <= 100 and .samples >= 2 and .transitions >= 0)' /tmp/pulse.json >/dev/null
          jq -e '[.items[].score] as $s | reduce range(1; $s|length) as $i (true; . and ($s[$i-1] >= $s[$i]))' /tmp/pulse.json >/dev/null
          jq -e 'all(.items[].reason; (ascii_downcase|contains("crash")|not) and (ascii_downcase|contains("accident")|not) and (ascii_downcase|contains("congestion")|not))' /tmp/pulse.json >/dev/null
          jq -e 'any(.items[]; .transitions > 0) or (.pulseScore == 0)' /tmp/pulse.json >/dev/null
          echo "PULSE=$(jq -c '{pulseScore,state,activeCameras,camerasAnalyzed,top:(.items[:6]|map({cameraId,label,score,reason,transitions,samples}))}' /tmp/pulse.json)"
      - name: Browser Pulse interaction
        shell: bash
        run: |
          npm install --no-save playwright >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
          mkdir -p tests
          cat > tests/pulse-browser-validation.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(`${process.env.PREVIEW_URL}/?pulse_validation=${Date.now()}`,{waitUntil:'networkidle'});
          const pulse=page.locator('#pulse');
          await pulse.waitFor();
          await pulse.locator('.pulse-card').first().waitFor({timeout:15000});
          const text=await pulse.innerText();
          if(!text.includes('Seattle Pulse')) throw new Error('Pulse heading missing');
          if(text.includes('0 active cameras') && !text.includes('quiet')) throw new Error('Pulse active summary inconsistent');
          await pulse.locator('.pulse-card').first().click();
          await page.locator('#modal[open]').waitFor();
          await page.locator('#time-machine').waitFor();
          if(errors.length) throw new Error(errors.join('; '));
          await browser.close();
          console.log('Seattle Pulse browser interaction passed');
          JS
          node tests/pulse-browser-validation.mjs
      - name: Lighthouse default path
        shell: bash
        run: |
          for i in 1 2 3; do
            npx lighthouse "$PREVIEW_URL/?lh=$i" --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility --output=json --output-path="/tmp/lh-$i.json"
          done
          node - <<'JS'
          const fs=require('fs');
          const rows=[1,2,3].map(i=>{const r=JSON.parse(fs.readFileSync(`/tmp/lh-${i}.json`));return {performance:Math.round(r.categories.performance.score*100),a11y:Math.round(r.categories.accessibility.score*100),lcp:Math.round(r.audits['largest-contentful-paint'].numericValue),tbt:Math.round(r.audits['total-blocking-time'].numericValue),cls:r.audits['cumulative-layout-shift'].numericValue};});
          console.log('LIGHTHOUSE='+JSON.stringify(rows));
          if(Math.min(...rows.map(r=>r.performance))<95) process.exit(1);
          if(Math.min(...rows.map(r=>r.a11y))<100) process.exit(1);
          if(Math.max(...rows.map(r=>r.cls))>0.05) process.exit(1);
          JS
