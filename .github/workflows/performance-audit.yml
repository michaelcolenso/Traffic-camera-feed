name: Production performance audit

on:
  workflow_run:
    workflows:
      - Deploy to Cloudflare
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Wait for production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://cams.hoxel.dev/ >/dev/null; then
              exit 0
            fi
            echo "Production not ready yet (${attempt}/12)"
            sleep 5
          done
          exit 1

      - name: Run three mobile Lighthouse samples
        shell: bash
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            echo "Running mobile Lighthouse sample ${sample}/3"
            npx --yes lighthouse@latest https://cams.hoxel.dev/ \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="./lighthouse-mobile-${sample}.json" \
              --quiet
          done

      - name: Run desktop Lighthouse
        run: |
          npx --yes lighthouse@latest https://cams.hoxel.dev/ \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-desktop.json \
            --quiet

      - name: Publish metrics summary
        shell: python
        run: |
          import json
          import os
          import statistics

          def read_report(filename):
              with open(filename) as f:
                  return json.load(f)

          def row(label, report):
              audits = report['audits']
              categories = report['categories']
              return {
                  'device': label,
                  'performance': round(categories['performance']['score'] * 100),
                  'accessibility': round(categories['accessibility']['score'] * 100),
                  'fcp': audits['first-contentful-paint']['displayValue'],
                  'lcp': audits['largest-contentful-paint']['displayValue'],
                  'tbt': audits['total-blocking-time']['displayValue'],
                  'cls': audits['cumulative-layout-shift']['displayValue'],
                  'speed_index': audits['speed-index']['displayValue'],
              }

          mobile_rows = [row(f'Mobile {sample}', read_report(f'lighthouse-mobile-{sample}.json')) for sample in range(1, 4)]
          desktop_row = row('Desktop', read_report('lighthouse-desktop.json'))
          rows = mobile_rows + [desktop_row]
          mobile_scores = [item['performance'] for item in mobile_rows]

          print(json.dumps(rows, indent=2))
          print(f"Mobile performance min/median/max: {min(mobile_scores)}/{statistics.median(mobile_scores):g}/{max(mobile_scores)}")

          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a') as f:
              f.write('## cams.hoxel.dev Lighthouse\n\n')
              f.write(f"**Mobile performance min / median / max:** {min(mobile_scores)} / {statistics.median(mobile_scores):g} / {max(mobile_scores)}\n\n")
              f.write('| Sample | Performance | Accessibility | FCP | LCP | TBT | CLS | Speed Index |\n')
              f.write('|---|---:|---:|---:|---:|---:|---:|---:|\n')
              for item in rows:
                  f.write(f"| {item['device']} | {item['performance']} | {item['accessibility']} | {item['fcp']} | {item['lcp']} | {item['tbt']} | {item['cls']} | {item['speed_index']} |\n")

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production
          path: |
            lighthouse-mobile-1.json
            lighthouse-mobile-2.json
            lighthouse-mobile-3.json
            lighthouse-desktop.json
          retention-days: 14

      - name: Enforce performance budgets
        shell: python
        run: |
          import json
          import sys

          def read_report(filename):
              with open(filename) as f:
                  return json.load(f)

          def score(report, category):
              return round(report['categories'][category]['score'] * 100)

          def numeric(report, audit):
              return report['audits'][audit]['numericValue']

          mobiles = [read_report(f'lighthouse-mobile-{sample}.json') for sample in range(1, 4)]
          desktop = read_report('lighthouse-desktop.json')
          failures = []

          for index, mobile in enumerate(mobiles, start=1):
              checks = [
                  (f'mobile {index} performance', score(mobile, 'performance'), 95, '>='),
                  (f'mobile {index} accessibility', score(mobile, 'accessibility'), 100, '>='),
                  (f'mobile {index} LCP ms', numeric(mobile, 'largest-contentful-paint'), 2500, '<='),
                  (f'mobile {index} TBT ms', numeric(mobile, 'total-blocking-time'), 200, '<='),
                  (f'mobile {index} CLS', numeric(mobile, 'cumulative-layout-shift'), 0.05, '<='),
              ]
              for name, actual, limit, op in checks:
                  passed = actual >= limit if op == '>=' else actual <= limit
                  print(f"{'PASS' if passed else 'FAIL'} {name}: {actual:.2f} {op} {limit}")
                  if not passed:
                      failures.append(f'{name}: {actual:.2f} (required {op} {limit})')

          desktop_checks = [
              ('desktop performance', score(desktop, 'performance'), 95, '>='),
              ('desktop accessibility', score(desktop, 'accessibility'), 100, '>='),
          ]
          for name, actual, limit, op in desktop_checks:
              passed = actual >= limit
              print(f"{'PASS' if passed else 'FAIL'} {name}: {actual:.2f} {op} {limit}")
              if not passed:
                  failures.append(f'{name}: {actual:.2f} (required {op} {limit})')

          if failures:
              print('\nPerformance budget failures:')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)
