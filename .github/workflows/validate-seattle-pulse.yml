name: Validate Seattle Pulse

on:
  push:
    branches: [feature/seattle-pulse]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate Seattle Pulse against live history'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate source
        run: |
          node --check prototype/vanilla/public/benchmark.js
          npm run lint
      - name: Build isolated preview config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('wrangler.jsonc').read_text())
          data['name']='hoxel-traffic-camera-pulse-benchmark'
          data.pop('routes',None)
          data.pop('triggers',None)
          data['workers_dev']=True
          data['preview_urls']=True
          Path('wrangler.pulse-preview.jsonc').write_text(json.dumps(data,indent=2)+'\n')
          PY
          npx wrangler types /tmp/pulse-preview-types.d.ts --config wrangler.pulse-preview.jsonc
          grep -q HISTORY_DB /tmp/pulse-preview-types.d.ts
          grep -q HISTORY_BUCKET /tmp/pulse-preview-types.d.ts
      - name: Deploy isolated Pulse preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.pulse-preview.jsonc 2>&1 | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)
          test -n "$url"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - name: Validate Pulse API against real D1 history
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..15}; do
            nonce=$(date +%s%N)
            status=$(curl -sS --max-time 15 -o /tmp/pulse.json -w '%{http_code}' "$PREVIEW_URL/api/pulse?window=60&limit=12&v=$nonce" || true)
            echo "Pulse readiness $i: $status"
            if [ "$status" = 200 ] && jq -e '.pulseScore|type=="number"' /tmp/pulse.json >/dev/null 2>&1 && jq -e '.items|type=="array"' /tmp/pulse.json >/dev/null 2>&1; then ready=1; break; fi
            cat /tmp/pulse.json 2>/dev/null || true
            sleep 3
          done
          test "$ready" -eq 1
          jq -e '.camerasAnalyzed > 0 and (.items|length) > 0' /tmp/pulse.json >/dev/null
          jq -e '.methodology | contains("does not infer crashes")' /tmp/pulse.json >/dev/null
          jq -e 'all(.items[]; (.score >= 0 and .score <= 100 and .samples >= 2 and .transitions >= 0 and (.cameraId|length)>0 and (.reason|length)>0))' /tmp/pulse.json >/dev/null
          jq -e '[.items[].score] as $s | reduce range(1; $s|length) as $i (true; . and ($s[$i-1] >= $s[$i]))' /tmp/pulse.json >/dev/null
          jq -e 'all(.items[].reason; (ascii_downcase|contains("crash")|not) and (ascii_downcase|contains("accident")|not) and (ascii_downcase|contains("congestion")|not))' /tmp/pulse.json >/dev/null
          echo "Pulse payload: $(jq -c '{pulseScore,state,activeCameras,camerasAnalyzed,top:(.items[:3]|map({cameraId,label,score,reason,transitions,samples}))}' /tmp/pulse.json)"
      - name: Browser Pulse interaction test
        shell: bash
        run: |
          npx playwright install chromium --with-deps >/dev/null
          cat > /tmp/pulse-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(`${process.env.PREVIEW_URL}/?pulse_validation=${Date.now()}`,{waitUntil:'networkidle'});
          await page.locator('#pulse').waitFor();
          await page.locator('.pulse-card').first().waitFor({timeout:15000});
          const heading=await page.locator('#pulse').innerText();
          if(!heading.includes('Seattle Pulse'))throw new Error('Pulse heading missing');
          await page.locator('.pulse-card').first().click();
          await page.locator('#modal[open]').waitFor();
          await page.locator('#time-machine').waitFor();
          if(errors.length)throw new Error(errors.join('; '));
          await browser.close();
          console.log('Pulse browser interaction passed');
          JS
          node /tmp/pulse-browser.mjs
      - name: Lighthouse default path
        shell: bash
        run: |
          for i in 1 2 3; do
            npx lighthouse "$PREVIEW_URL/?lh=$i" --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility --output=json --output-path="/tmp/lh-$i.json"
          done
          node - <<'JS'
          const fs=require('fs');
          const rows=[1,2,3].map(i=>{const r=JSON.parse(fs.readFileSync(`/tmp/lh-${i}.json`));return {performance:Math.round(r.categories.performance.score*100),a11y:Math.round(r.categories.accessibility.score*100),lcp:Math.round(r.audits['largest-contentful-paint'].numericValue),tbt:Math.round(r.audits['total-blocking-time'].numericValue),cls:r.audits['cumulative-layout-shift'].numericValue};});
          console.log(rows);
          if(Math.min(...rows.map(r=>r.performance))<95)process.exit(1);
          if(Math.min(...rows.map(r=>r.a11y))<100)process.exit(1);
          if(Math.max(...rows.map(r=>r.cls))>0.05)process.exit(1);
          JS
