name: Apply Phase 2 capture patch

on:
  push:
    branches:
      - agent/what-changed-phase-2
    paths:
      - scripts/apply-phase2-capture.py
      - .github/workflows/apply-phase2-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/what-changed-phase-2
          fetch-depth: 0
      - name: Apply capture and client patch
        run: python scripts/apply-phase2-capture.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/vanilla/history.ts prototype/vanilla/public/benchmark.js
          git diff --cached --quiet && exit 0
          git commit -m "Wire server-owned visual observations"
          git push origin HEAD:agent/what-changed-phase-2
