name: Validate Phase 2 sensing

on:
  push:
    branches:
      - agent/what-changed-phase-2
    paths:
      - .github/workflows/apply-phase2-capture.yml
      - prototype/vanilla/**
      - migrations/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/what-changed-phase-2
          fetch-depth: 0
      - name: Remove accidental ES2023 probe
        run: |
          sed -i '/const firstChanged = .*findLast/d' prototype/vanilla/pulse.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prototype/vanilla/pulse.ts
            git commit -m "Keep Pulse engine ES2022-compatible"
            git push origin HEAD:agent/what-changed-phase-2
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Validate vanilla Worker configuration
        run: |
          npx wrangler types /tmp/phase2-worker-configuration.d.ts --config prototype/vanilla/wrangler.jsonc
          test -s /tmp/phase2-worker-configuration.d.ts
          grep -q 'IMAGES' /tmp/phase2-worker-configuration.d.ts
      - name: Syntax check browser modules
        run: |
          node --check prototype/vanilla/public/benchmark.js
          node --check prototype/vanilla/public/phase2.js
