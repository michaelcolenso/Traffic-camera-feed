name: Patch Seattle Pulse CLS

on:
  push:
    branches: [feature/seattle-pulse]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Seattle Pulse layout reservation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reserve Pulse rail height before async hydration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('prototype/vanilla/public/benchmark.css')
          s=p.read_text()
          old='.pulse{max-width:80rem;margin:.9rem auto 0;padding:0 1rem}'
          new='.pulse{max-width:80rem;margin:.9rem auto 0;padding:0 1rem;min-height:9rem}'
          if old not in s: raise SystemExit('Pulse CSS anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check prototype/vanilla/public/benchmark.js
          npm run lint
      - name: Commit layout reservation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/vanilla/public/benchmark.css
          git commit -m 'Reserve Seattle Pulse layout height'
          git push
